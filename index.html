<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우주 문명 - 우주 탐험 + 행성 건설 통합 v13</title>
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/ui.css">
<link rel="stylesheet" href="styles/main-menu.css">
<link rel="stylesheet" href="styles/galaxy-background.css">
<link rel="stylesheet" href="styles/celestial-models.css">
<link rel="stylesheet" href="styles/command-ui.css">
<link rel="stylesheet" href="styles/habitat-surface.css">
<link rel="stylesheet" href="styles/research.css">
</head>
<body>
<aside id="tutorialBubble" class="hide" aria-label="튜토리얼 안내"><span id="tutorialText" aria-live="polite"></span> <button id="tutorialNext">다음</button></aside>
<div id="tutorialControls" class="hide"><span id="tutorialStatus" role="status"></span><button id="tutorialExit">훈련 나가기</button></div>
<header class="top command-top">
<div class="civilization"><img src="assets/icons/crest.svg" alt="" aria-hidden="true"><div><strong id="civilizationName">테라 문명</strong><small id="ownership">개척 항성계 1</small></div><span class="pill" id="turn">턴 1</span></div>
<div class="resources" id="resource"></div>
<div class="top-tools"><button id="logBtn" title="진행 기록" aria-label="진행 기록"><img src="assets/icons/log.svg" alt="" aria-hidden="true"></button><button id="notificationsBtn" title="알림" aria-label="알림"><img src="assets/icons/notification.svg" alt="" aria-hidden="true"></button><button id="helpBtn" title="도움말" aria-label="도움말"><img src="assets/icons/help.svg" alt="" aria-hidden="true"></button><button id="menuBtn" title="메뉴" aria-label="메뉴" aria-controls="menuDrop" aria-expanded="false"><img src="assets/icons/menu.svg" alt="" aria-hidden="true"></button></div><div id="menuDrop" class="menuDrop hide"><button id="toMain">메인 메뉴</button><button id="gameLoad">불러오기</button><button id="gameSave">저장하기</button><button id="gameSettings">설정</button><div class="menuSeed">현재 시드: <b id="currentSeed">-</b></div><input type="checkbox" id="quickMove" hidden><button id="revealMapBtn" class="subtle" title="테스트용 시야로 전환">전체 지도</button></div></header>
<div class="layout"><main class="main"><nav class="command-nav" aria-label="문명 화면"><button id="galaxyNav" title="은하 지도" aria-label="은하 지도"><img src="assets/icons/galaxy.svg" alt="" aria-hidden="true"><span>은하 지도</span></button><button id="researchNav" title="연구" aria-label="연구"><img src="assets/icons/research.svg" alt="" aria-hidden="true"><span>연구</span></button><button id="planetsNav" title="거주 행성" aria-label="거주 행성"><img src="assets/icons/habitable.svg" alt="" aria-hidden="true"><span>거주 행성</span></button><button id="fleetNav" title="전투 함선" aria-label="전투 함선"><img src="assets/icons/fleet.svg" alt="" aria-hidden="true"><span>전투 함선</span></button><button id="victoryNav" title="승리" aria-label="승리"><img src="assets/icons/victory.svg" alt="" aria-hidden="true"><span>승리</span></button></nav><div class="toolbar"><button id="back" class="hide">← 은하 지도로</button><b id="viewTitle" tabindex="-1">은하 지도</b><span style="flex:1"></span><button id="zoomout" title="축소">−</button><button id="zoomin" title="확대">＋</button><button id="center" title="모행성으로 이동">중앙</button></div><div class="mapWrap" id="mapWrap"><svg id="map" viewBox="0 0 1050 790" aria-label="은하 지도"></svg><div class="tip" id="mapTip">성계 클릭: 내부 화면 · 함선 클릭: 명령 · 드래그: 지도 이동</div></div><div class="sysWrap hide" id="systemView"><div class="stellar-viewport" tabindex="0" role="region" aria-label="항성계 행성 지도"><div class="stellar-scene" id="planetList"></div></div><div class="stellar-legend"><span class="hab">거주 가능</span><span class="gas">가스</span><span class="mineral">광물</span><span class="barren">불모</span></div></div><div id="habitatView" class="habitat hide"><div class="hab-hdr"><div><h2 id="habTitle">거주 가능 행성</h2></div></div><div class="queueBox" id="habConstruction" role="status"></div><section class="hab-panel hab-overview-panel" aria-label="행성 인구 및 자원 현황"><div class="hab-stats" id="habStats"></div><div class="hab-economy" id="habEconomy"></div></section><section class="hab-panel hab-common-panel"><div class="hab-section-head"><h3>공용 건물 </h3><span id="habCommonInfo"></span></div><div class="hab-common-grid" id="habCommon"></div><div class="hab-foot"><small id="habExpandQuote"></small><button id="habExpandCommon" class="primary">공용 구역 확장</button></div></section><section class="hab-panel hab-special-panel"><div class="hab-section-head"><h3>특화 건물 </h3></div><div class="hab-spec-grid" id="habSpecial"></div></section></div></main><aside class="side ship-dock"><section id="shipPanel"><h2>함선</h2><div class="stack"><div class="detail" id="selectedShipInfo"></div></div><p class="muted" role="status"></p><div class="actions"><button id="moveBtn" class="primary" disabled>이동</button><button id="scanBtn" disabled>탐사</button><button id="colonizeBtn" disabled>개척</button><button id="gatewayBtn" class="hide" title="소유 관문 사이를 직접 이동">관문 이동</button><button id="warpBtn" disabled class="hide">블랙홀 이동</button><button id="openBtn" disabled class="hide">항성계 화면</button></div></section><ol class="log hide" id="log"></ol></aside><div class="turnDock"><button class="primary" id="nextTurn">다음 턴<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4 5 5 5-5 5m7-10 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div><div id="explorationNotice" class="exploration-notice" role="status" aria-atomic="true"></div><div id="overlay" class="overlay hide"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="head"><h2 id="modalTitle"></h2><button id="closeModal" class="subtle" aria-label="닫기" title="닫기">×</button></div><p id="modalDesc" class="muted"></p><div id="modalBody"></div></div></div>
<div id="mainScreen" class="screen" aria-labelledby="mainTitle">
 <div class="mainMenuContent">
  <div class="mainMenuHeading">
   <img src="assets/icons/crest.svg" alt="">
   <h1 id="mainTitle">우주 문명</h1>
  </div>
  <nav class="menuButtons" aria-label="메인 메뉴">
   <div class="mainMenuPrimary">
    <button id="newGameMain">새 게임</button>
    <button id="loadMain">불러오기</button>
   </div>
   <div class="mainMenuPlay">
    <button id="tutorialMain" disabled title="개편 준비 중">튜토리얼 <small>준비 중</small></button>
    <button id="combatTestMain">전투 테스팅</button>
   </div>
   <div class="mainMenuUtility">
    <button id="settingsMain">설정</button>
    <button id="exitMain">종료</button>
   </div>
  </nav>
 </div>
</div>
<div id="raceScreen" class="screen hide" aria-labelledby="setupTitle">
 <div class="screenCard game-setup">
  <h1 id="setupTitle" tabindex="-1">새 게임</h1>
  <div class="raceCard"><img src="assets/icons/crest.svg" alt=""><div><small>기본 종족</small><b>테라 문명</b></div></div>
  <div class="seedForm"><label for="seedInput" title="같은 시드와 설정이면 같은 은하가 생성됩니다.">맵 시드 <span>선택</span></label>
   <input id="seedInput" type="text" maxlength="60" placeholder="비워두면 무작위 시드"></div>
  <div class="menuButtons"><button id="raceBack">메인 메뉴</button><button class="primary" id="startGame">게임 시작</button></div>
 </div>
</div>
<section id="combatTestScreen" class="screen hide" aria-labelledby="combatTestTitle">
 <header class="combat-test-header">
  <div><h1 id="combatTestTitle">전투 테스팅</h1><p id="combatTestStatus" role="status"></p></div>
  <div class="combat-test-header-actions"><button id="combatTestExit">메인 메뉴</button><button id="combatTestReset" hidden>편성으로 돌아가기</button><button id="combatTestStart" class="primary">플레이 시작</button><button id="combatTestNext" class="primary" hidden>다음 턴</button></div>
 </header>
 <div class="combat-test-layout">
  <div class="combat-test-map-pane">
   <label id="combatTestPosture">AI 태세 <select id="combatTestPostureChoice"><option value="defensive" title="AI 전선에서 대기">수비적</option><option value="aggressive" title="플레이어 전선으로 진격">공격적</option></select></label>
   <div id="combatTestMapScroll" class="combat-test-map-scroll"><div id="combatTestMap" aria-label="4성계 연결 지도"></div></div>
   <section id="combatTestSystem" aria-label="전투 테스팅 항성계" hidden></section>
   <section id="combatTestCommands" class="test-ship-panel" aria-label="함선 명령" hidden><h2>함선</h2><div id="combatTestSelectedShip"></div><div class="actions"><button id="combatTestMove" class="primary" hidden>이동</button></div><p id="combatTestMoveHint" class="muted" hidden>목적지 선택 · Esc 취소</p></section>
  </div>
  <aside class="combat-test-fleet-panel">
   <div class="combat-test-fleet-heading"><h2 title="Shift / Ctrl / ⌘ + 클릭으로 다중 선택">소유 함대</h2><button id="combatTestDetails">상세 보기</button></div>
   <div id="combatTestFleets"></div>
   <h2>적 AI 함대</h2><div id="combatTestEnemyFleets"></div>
  </aside>
 </div>
</section>
<script src="game.js"></script>
</body></html>
